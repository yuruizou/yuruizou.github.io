  - id: "conversational-glb-hybrid-feedback"
    title: "Conversational Generalized Linear Bandits with Hybrid Feedback"
    authors:
      - name: "Yurui Zou"
        me: true
      - name: "Qirun Zeng"
      - name: "Jinhang Zuo"
    venue: "arXiv preprint, 2026"
    venue_group: "Preprint"
    url: "https://arxiv.org/abs/2610.35262"
    publication_date: "October 26, 2026"
    publication_date_iso: "2026-10-26"
    doi: "10.48550/arXiv.2610.35262"
    abstract: >-
      Conversational bandits improve recommendations by actively querying users about key-terms to elicit their item preferences. 
      However, existing methods typically assume homogeneous feedback for items and key-terms, using either absolute rewards or pairwise comparisons. 
      In practice, item feedback often takes the form of clicks or ratings, while comparisons are more natural for key-terms. 
      To address this gap, we study conversational generalized linear bandits with hybrid feedback, combining absolute item rewards and relative key-term comparisons. 
      We propose Conversational UCB with Hybrid Feedback (HyConUCB), which constructs unified confidence bounds from heterogeneous feedback and adaptively selects key-term comparisons by balancing information gain and directional coverage. 
      Through a refined regret analysis that jointly exploits both feedback sources, we establish a regret bound that improves upon reward-only and adapted dueling-only benchmarks. 
      Experiments on synthetic and real-world datasets validate the effectiveness of our algorithm.
