    publication_date: "October 26, 2026"
    publication_date_iso: "2026-10-26"
    doi: "10.48550/arXiv.2610.35262"
    abstract: >-
      We study conversational bandit learning with numerical feedback on items
      and pairwise comparisons of key-terms. Our HyConUCB algorithm combines both
      feedback sources to guide recommendations and conversational queries,
      with theoretical regret guarantees and evaluation on synthetic and
      real-world data.
